<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mimah's Atelier · Business &amp; Website Discovery Questionnaire</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to the questions</a>

<header class="top" id="top">
  <div class="top__inner">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Show sections" aria-expanded="false" aria-controls="nav">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
    </button>
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 40 40" width="34" height="34" aria-hidden="true">
        <circle cx="20" cy="20" r="14" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M8 16c8 4 16 4 24 0M7 22c9 4 17 4 26 0M10 28c7 3 13 3 20 0" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".7"/>
        <path d="M30 31c4 3 6 5 4 7" fill="none" stroke="#B8964E" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="brand__name">MIMAH'S ATELIER</div>
        <div class="brand__sub">Business &amp; Website Discovery Questionnaire</div>
      </div>
    </div>
    <div class="top__right">
      <span class="save-note" id="saveNote" role="status" aria-live="polite"></span>
    </div>
  </div>
  <div class="progress" id="progress" hidden>
    <div class="progress__label"><span id="progressText">0% complete</span><span id="progressReq"></span></div>
    <div class="thread" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="threadBar"><span class="thread__fill" id="threadFill"></span><span class="thread__ball" id="threadBall"></span></div>
  </div>
</header>

<div class="shell" id="shell">
  <nav class="nav" id="nav" aria-label="Questionnaire sections" hidden></nav>
  <div class="scrim" id="scrim" hidden></div>
  <main id="main" tabindex="-1"></main>
</div>

<footer class="foot">
  <p>🔒 Your answers are stored <strong>only on this device</strong>, in this browser. Nothing is uploaded. Please don't type passwords, ID numbers or bank details.</p>
</footer>

<div id="printArea" aria-hidden="true"></div>

<script src="config.js"></script>
<script src="questionnaire-data.js"></script>
<script src="app.js"></script>
</body>
</html>
